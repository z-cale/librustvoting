[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# The default root build is the Zakura application path. LRZ and the
# lower-level VCT packages are validated in separate invocations because their
# backend features are mutually exclusive within one Cargo resolve.
default-members = [
    "zcash_voting",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
voting-circuits = { version = "=0.11.3", default-features = false }
voting-crypto-deps = { version = "=0.2.3", default-features = false }
zcash_protocol = { version = "0.10.4" }

# Temporary stacked-PR overrides; remove after voting-circuits 0.11.3 is
# published.
[patch.crates-io]
voting-circuits = { git = "https://github.com/valargroup/voting-circuits.git", rev = "39386cab9f0037b42bbccaaadf3c65f51112d0b1" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits.git", rev = "39386cab9f0037b42bbccaaadf3c65f51112d0b1" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3

# Debug info dominates link time across the ~900-test suite and is the main
# reason `target/` grows without bound. Line tables preserve backtraces and
# panic locations; full DWARF for third-party crates buys nothing locally.
# CI achieves the same for one job via CARGO_PROFILE_TEST_DEBUG=0.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
